  fringe_rate: 30  # % of personnel for fringe benefits
  travel_per_diem:
    domestic: 200  # $/day
    lodging: 150  # $/night

narrative:
  mission: >
    AI Incubator for Main Street builds practical pathways for Kentucky's youth
    and small businesses to thrive in an AI-transformed economy. Our flagship
    program, Springer, teaches teens the skills no one else is teaching: selling,
    financial literacy, networking, AI as a learning tool, and self-sufficiency.
    We don't teach kids to build the next unicorn. We teach them to survive and
    thrive in the new world.
  differentiator: >
    Every other youth entrepreneurship camp teaches pitch decks and business model
    canvases. Springer teaches kids how to sell to a real person, how money actually
    works, and how to use AI to learn anything. Our mentors are community leaders
    who run real local businesses, not tech execs. The result is skills and a
    lasting support network — not a certificate.

